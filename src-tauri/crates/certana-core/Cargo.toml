[package]
name = "certana-core"
description = "UI-independent PKI, key-vault and persistence logic for Certana"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# PKI
rcgen = { version = "0.14", features = ["pem", "x509-parser", "zeroize"] }
rsa = "0.9"
x509-parser = "0.18"
x509-cert = "0.3"
pkcs8 = { version = "0.11", features = ["encryption", "getrandom", "pem", "std"] }
p12-keystore = "0.4"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
# Secrets
argon2 = "0.6"
age = { version = "0.12", features = ["armor"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
# Persistence
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rusqlite_migration = "2.6"
# Common
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
tracing = "0.1"
hex = "0.4"
rustls-pki-types = "1"

[dev-dependencies]
tempfile = "3"
