[workspace]
members = ["crates/certana-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/certana/certana"
authors = ["Certana Contributors"]

[package]
name = "certana"
description = "Certana – internal certificate authority management for Linux desktops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "certana_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
certana-core = { path = "crates/certana-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
secrecy = "0.10"
time = { version = "0.3", features = ["serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
